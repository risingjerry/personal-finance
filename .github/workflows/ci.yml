name: ci
on:
  push:
  pull_request:
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: demo
        run: python -m pfin demo
      - name: framework tests
        run: python -m unittest discover -s tests
      - name: connector tests
        run: |
          for d in connectors/*/tests; do
            echo "== $d"; python -m unittest discover -s "$d" -t . || exit 1
          done
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd connectors/alipay && npm test
      - run: cd connectors/okx/okx-bills && npm test
